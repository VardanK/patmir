[project]
name = "patmir"
version = "0.0.0"
description = "Local-first Armenian dubbing workstation — Phase 0 feasibility harness"
requires-python = ">=3.11"
dependencies = [
  # Core eval harness only — no Phase 1 pipeline deps yet.
  # Local model candidates pull in heavy ML deps and are kept optional via extras.
]

[project.optional-dependencies]
# Translation / TTS via HuggingFace transformers (NLLB, MMS-TTS).
local = [
  "torch>=2.2",
  "transformers>=4.40",
  "sentencepiece>=0.2",
  "numpy>=1.26",
  "piper-tts>=1.4",     # Eastern-Armenian community voice (the local TTS baseline)
  "huggingface-hub>=0.20",
]
# Cloud baselines (translation ceiling + TTS ceiling).
cloud = [
  "anthropic>=0.30",
  "openai>=1.30",
  "google-cloud-texttospeech>=2.16",
]
all = ["patmir[local,cloud]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["patmir"]
