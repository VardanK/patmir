[project]
name = "patmir"
version = "0.0.0"
description = "Local-first Armenian dubbing workstation"
requires-python = ">=3.11"
dependencies = [
  # Core eval harness only — no heavy ML deps at the root.
  # Pipeline stages and model candidates pull deps via extras.
]

[project.optional-dependencies]
# Translation / TTS via HuggingFace transformers (NLLB, MMS-TTS).
local = [
  "torch>=2.2",
  # >=5.5, not >=4.40. The Higgs TTS checkpoint declares
  # `transformers_version: 5.5.0` and relies on 5.x contracts: its
  # tokenizer_config gives `extra_special_tokens` as a LIST (62 entries), which
  # 4.x feeds to `_set_model_specific_special_tokens` expecting a dict, dying on
  # `.keys()`; and its remote code passes `key_mapping` to `from_pretrained`.
  # The old permissive floor let installing nemo_toolkit silently resolve
  # transformers down to 4.57 and break the TTS stage — after it had already
  # worked on the same machine. A floor that matches the checkpoint turns that
  # into an install-time conflict instead of a runtime one.
  "transformers>=5.5",
  "sentencepiece>=0.2",
  "numpy>=1.26",
  "piper-tts>=1.4",       # Eastern-Armenian community voice (the local TTS baseline)
  "huggingface-hub>=0.20",
  "faster-whisper>=1.0",  # Phase 1 ASR (CT2; CPU on Mac)
  # MLX only exists on Apple Silicon. Without these markers, `pip install
  # .[local]` on a CUDA box installs them anyway and the first MLX candidate to
  # load dies with `libmlx.so: cannot open shared object file` — an error that
  # says nothing about the real problem. The MLX *candidates* stay registered
  # regardless; they are simply unselectable off Darwin (see
  # [pipeline.profiles.cuda] in patmir.toml).
  "mlx-whisper>=0.4; sys_platform == 'darwin'",   # Phase 1 ASR (MLX, default since Phase 1.3)
  "mlx-audio>=0.4; sys_platform == 'darwin'",     # MLX-native OmniVoice TTS + sortformer_mlx diarize
  # These three were installed by hand on the laptop and never declared, so a
  # fresh Mac checkout could not actually run the DEFAULT profile.
  "demucs-mlx>=1.4; sys_platform == 'darwin'",    # htdemucs_mlx / htdemucs_mlx_vocals separate
  "mlx-qwen3-asr>=0.3; sys_platform == 'darwin'", # qwen3_asr_1_7b_mlx_8bit (active ASR on Mac)
  "mlx-lm>=0.31; sys_platform == 'darwin'",       # Qwen3 backbone for the higgs_v3_mlx TTS port
  "llama-cpp-python>=0.3",  # GGUF translation backend (Metal-enabled build)
  "yt-dlp>=2024.0",       # YouTube ingestion for sample clips
  "pyrubberband>=0.3",    # Phase 1 mux time-stretching (needs system `rubberband` binary)
  "soundfile>=0.12",      # WAV I/O for mux
  "torchaudio>=2.2",      # ref-clip load/resample in both Higgs TTS candidates
  "demucs>=4.0",          # Phase 1 vocal/accompaniment separation
  "silero-vad>=5.0",      # Phase 1 VAD on the vocal stem (htdemucs.py)
  "pyannote.audio>=3.1",  # Phase 2 speaker diarization (SOTA + overlap detection)
  "funasr>=1.1",          # Phase 2.x emotion2vec SER inference (per-turn emotion detection)
  "modelscope>=1.20",     # funasr's model-download dependency
  "speechbrain>=1.1",     # Phase 3 (D3) ECAPA speaker embeddings for cross-section identity
]
# Cloud baselines (translation ceiling + TTS ceiling).
cloud = [
  "httpx>=0.27",          # OpenRouter transport (translate + the cloud TTS candidates)
  "anthropic>=0.30",
  "openai>=1.30",
  "google-cloud-texttospeech>=2.16",
]
# Deps that ONLY the `cuda` machine profile needs — the torch siblings of the
# MLX candidates ([pipeline.profiles.cuda] in patmir.toml). Deliberately not in
# `all`: nemo_toolkit is a heavy, Linux-first build that has no business being
# pulled onto the Apple-Silicon laptop, where these candidates are unselectable
# anyway. Install explicitly on the workstation:
#     uv pip install -e ".[local,ui,dev,cuda]"
cuda = [
  # `qwen-asr` (the official Qwen package) is deliberately ABSENT and must not
  # be installed. It pins transformers==4.57.6 EXACTLY, mutually exclusive with
  # the Higgs TTS checkpoint's >=5.5, and it drags in exact pins on accelerate,
  # nagisa and soynlp plus gradio/flask/sox. Installing it silently resolves
  # transformers down and breaks the TTS stage.
  #
  # It is also unnecessary: transformers 5.13.0 added native `qwen3_asr`
  # (Qwen3ASRForConditionalGeneration + Qwen3ASRForTokenClassification for the
  # forced aligner), which is what the `qwen3_asr` candidate module drives. This
  # floor is higher than `local`'s >=5.5 because that candidate needs it; the
  # module also gates on it at build time so a stale env gives the fix rather
  # than `KeyError: 'qwen3_asr'`.
  "transformers>=5.13",
  "nemo_toolkit[asr]>=2.0",  # `sortformer_nemo` (NVIDIA's own Sortformer runtime)
]
# Local FastAPI progress UI (Phase 1).
ui = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "jinja2>=3.1",
]
all = ["patmir[local,cloud,ui]"]
# Test runner for the patmir/tests/ suite.
dev = [
  "pytest>=8",
]

[project.scripts]
patmir = "patmir.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["patmir"]
