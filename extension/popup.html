<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Patmir</title>
  <style>
    body { font: 13px -apple-system, system-ui, sans-serif; margin: 0; padding: 14px; width: 280px; }
    h1 { font-size: 14px; margin: 0 0 10px; color: #333; }
    button { width: 100%; padding: 8px 10px; font-size: 13px; border-radius: 6px; border: 1px solid #c0c0c0; background: #fafafa; cursor: pointer; margin-top: 6px; }
    button.primary { background: #1a73e8; color: white; border-color: #1a73e8; }
    button.primary:disabled { background: #888; border-color: #888; }
    button.secondary { background: #fff; color: #555; }
    button.secondary:hover { background: #f3f3f3; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status { color: #555; font-size: 12px; margin-top: 8px; min-height: 32px; }
    .url { font-size: 11px; color: #888; word-break: break-all; margin-bottom: 8px; }
    .error { color: #c5221f; font-size: 12px; margin-top: 8px; }
    .hint { color: #888; font-size: 11px; margin-top: 6px; }
    a { color: #1a73e8; text-decoration: none; }
    .modes { display: flex; gap: 6px; margin-bottom: 10px; }
    .modes button { margin-top: 0; flex: 1; padding: 6px 4px; font-size: 12px; }
    .modes button.active { background: #1a73e8; color: #fff; border-color: #1a73e8; }
    .mode-note { color: #888; font-size: 11px; margin: -4px 0 8px; }
  </style>
</head>
<body>
  <h1>Patmir — Eastern Armenian dub</h1>
  <div class="url" id="url">…</div>
  <div class="modes" id="modes">
    <button id="mode-quality" data-mode="quality">Quality</button>
    <button id="mode-watch-along" data-mode="watch-along">Watch-along</button>
  </div>
  <div class="mode-note" id="mode-note"></div>
  <div id="content">
    <div class="status" id="status">Checking…</div>
    <button id="cta" class="primary" disabled>—</button>
    <button id="secondary" class="secondary" hidden>—</button>
    <div class="error" id="error" hidden></div>
    <div class="hint" id="hint">
      Local server must be running: <code>patmir ui --port 8765</code>.
      Token: <a href="#" id="open-options">Options</a>.
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
