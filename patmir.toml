# ElevenLabs Multilingual v2 — investigated 2026-05-26 as the first cloud-TTS
# attempt; Free-tier API access blocks both library voices (402 paid-plan-
# required) and IVC, so the pipeline can't run on a Free key. Registered as
# a future option for when / if a Creator-tier ($22/mo) ElevenLabs key is
# available. Superseded by OpenRouter TTS (below) for the active path.
# See ADRs `2026-05-26-elevenlabs-tts-cloud-opt-in.md` (attempted) +
# `2026-05-26-openrouter-tts-cloud-opt-in.md` (active).
[[eval.tts.candidates]]
id               = "elevenlabs_multilingual_v2"
enabled          = true
module           = "patmir.eval.candidates.tts.elevenlabs"
# Only `eleven_v3` accepts `language_code="hy"` for Armenian. Older models
# (eleven_multilingual_v2, eleven_turbo_v2_5, eleven_flash_v2_5) reject the
# language code and silently read Cyrillic/Armenian as English phonemes —
# the dub sounds like an English speaker doing fake Armenian. Verified
# 2026-05-26 via direct API probe.
model_id         = "eleven_v3"
language_code    = "hy"
api_key_env      = "ELEVENLABS_API_KEY"
default_voice_id = "21m00Tcm4TlvDq8ikWAM"   # "Rachel" — multilingual fallback when no IVC ref is available
cleanup_voices   = true
timeout_seconds  = 90.0
# Output format. `mp3_44100_128` works on every tier (Free → Pro); the
# candidate auto-decodes MP3 → WAV via ffmpeg (~50 ms / sentence; ffmpeg
# is already a project dep). `pcm_44100` is Pro-only; `pcm_22050` /
# `pcm_16000` are Creator+. Override if on a higher tier to skip decode.
output_format    = "mp3_44100_128"

# ElevenLabs no-clone "preset pool" mode — the recommended TTS for the
# near-realtime watch-along (D3) mode. Same eleven_v3 model, but instead of
# IVC-cloning the source speaker (which intermittently trips the celebrity-
# clone block, HTTP 403 voice_access_denied), each diarized speaker is
# assigned a stable library voice from `voice_pool` round-robin. No upload,
# no captcha path, lower first-dub latency. Pool defaults (in the candidate)
# are 8 cartoon-variety library voices; override here to curate.
# See ADR `2026-06-13-near-realtime-d3-spike.md`.
[[eval.tts.candidates]]
id               = "elevenlabs_pool"
enabled          = false
module           = "patmir.eval.candidates.tts.elevenlabs"
model_id         = "eleven_v3"
language_code    = "hy"
api_key_env      = "ELEVENLABS_API_KEY"
clone            = false
default_voice_id = "21m00Tcm4TlvDq8ikWAM"   # "Rachel" — fallback for no-speaker lines
cleanup_voices   = false                     # no uploads in pool mode → nothing to clean
concurrency      = 3                          # ElevenLabs tier cap; parallelizes per-sentence synth ~3×
timeout_seconds  = 90.0
output_format    = "mp3_44100_128"
# Entries are {id, gender, age} — the speaker registry (Slice 2 #7) profiles
# each diarized speaker (gender + age via an age-gender model) and assigns the
# best gender+age-matched voice. `age` is the SET of buckets a voice can cover
# (∈ child, young, adult, elder); with only 8 voices, each covers adjacent
# buckets so the pool stretches across all ages without sounding wrong.
voice_pool = [
  { id = "JBFqnCBsd6RMkjVDRZzb", gender = "male",   age = ["young", "adult", "elder"] },  # George  — warm storyteller
  { id = "EXAVITQu4vr4xnSDxMaL", gender = "female", age = ["young", "adult"] },            # Sarah
  { id = "N2lVS1w4EtoT3dr4eOWO", gender = "male",   age = ["young", "adult"] },            # Callum  — animation (trickster)
  { id = "cgSgspJ2msm6clMCkdW9", gender = "female", age = ["child", "young"] },            # Jessica — cute (kid)
  { id = "IKne3meq5aSn9XLyUdCD", gender = "male",   age = ["child", "young"] },            # Charlie — energetic (boy)
  { id = "FGY2WhTYpPnrIDTdsKH5", gender = "female", age = ["young", "adult"] },            # Laura   — quirky
  { id = "SOYHLrjzK2X1ezoPC6cr", gender = "male",   age = ["young", "adult"] },            # Harry   — animation (fierce)
  { id = "pqHfZKP75CvOlQylNhV4", gender = "male",   age = ["adult", "elder"] },            # Bill    — old, wise
]

# OpenRouter TTS — frontier cloud TTS via OpenRouter's /v1/audio/speech
# endpoint (OpenAI-compatible). Reuses the OPENROUTER_API_KEY already set
# for the translate stage; no separate vendor account or tier wall.
#
# Default model is google/gemini-3.1-flash-tts-preview — supports 200+
# inline audio tags (`[happy]`, `[sad]`, `[angry]`, `[whispers]`, etc.),
# which the candidate injects per sentence from `s.emotion`. Gives us
# explicit cloud-side emotion control without voice cloning or per-emotion
# settings juggling. See ADR `2026-05-26-openrouter-tts-cloud-opt-in.md`.
[[eval.tts.candidates]]
id              = "openrouter_gemini_flash_tts"
enabled         = true
module          = "patmir.eval.candidates.tts.openrouter"
model           = "google/gemini-3.1-flash-tts-preview"
api_key_env     = "OPENROUTER_API_KEY"
voice           = "Kore"        # default voice when no ref_audio (or voices pool is empty)
# Per-speaker voice rotation — speakers are assigned voices in encounter
# order, then bound for the rest of the run. Keeps character variety
# (mix of female + male voices). Override per-speaker via `voice_map`.
voices          = ["Kore", "Puck", "Aoede", "Charon", "Leda", "Orus"]
response_format = "pcm"         # Gemini TTS rejects mp3 — only pcm. Candidate wraps in WAV at 24 kHz.
speed           = 1.0
timeout_seconds = 90.0

# Alternates registered for A/B comparison — flip enabled = true + change
# [pipeline].tts to swap. Pricing per OpenRouter at 2026-05-26.
[[eval.tts.candidates]]
id              = "openrouter_gpt4o_mini_tts"
enabled         = false
module          = "patmir.eval.candidates.tts.openrouter"
model           = "openai/gpt-4o-mini-tts-2025-12-15"
api_key_env     = "OPENROUTER_API_KEY"
voice           = "alloy"       # OpenAI voices: alloy / echo / fable / onyx / nova / shimmer
response_format = "mp3"

[[eval.tts.candidates]]
id              = "openrouter_voxtral_mini_tts"
enabled         = false
module          = "patmir.eval.candidates.tts.openrouter"
model           = "mistralai/voxtral-mini-tts-2603"
api_key_env     = "OPENROUTER_API_KEY"
response_format = "mp3"

# ──────────────────────────────────────────────────────────────────────────────
# Phase 1 pipeline.
# ──────────────────────────────────────────────────────────────────────────────
# `[pipeline]` is the single source of truth for which candidate runs each
# stage. Each value is a candidate `id`; translation/tts ids resolve against
# `[[eval.<stage>.candidates]]`, the four new stages against
# `[[stages.<stage>.candidates]]` below.

[pipeline]
ingest    = "ffmpeg"
separate  = "htdemucs_mlx_vocals"
diarize   = "sortformer_mlx"
emotion   = "emotion2vec_plus_base"
asr       = "whisper_large_v3_mlx_fp16"
translate = "openrouter_gemini_flash"
tts       = "omnivoice_mlx_bf16"
mux       = "ffmpeg_pad_stretch"
output    = "mkv_default"

[pipeline.options]
stretch_cap            = 0.20    # max ±20% time-stretch ratio per sentence (preserves pitch)
asr_int8               = true
keep_intermediate      = true
music_bed_gain         = 0.6     # accompaniment level under the AR voice (1.0 = unchanged)
voice_gain_db          = -3.0    # global trim on top of the per-sentence RMS match (negative = quieter)
min_ref_seconds        = 1.5     # shortest clean turn that qualifies as a (speaker, emotion) ref clip (ElevenLabs IVC accepts ≥1 s; 1.5 leaves headroom)
sentence_afade_seconds = 0.05    # per-sentence fade in/out on the AR voice (suppresses boundary bleed — quality issue #4)

# Maps emotion2vec's 9 classes → 5 ref-clip bins. Each key is a SER class
# label (lowercase, English); each value is the bin name. Bins are:
# neutral | happy | sad | angry | fearful.
[emotion_bins]
angry      = "angry"
disgusted  = "angry"
fearful    = "fearful"
happy      = "happy"
neutral    = "neutral"
other      = "neutral"
sad        = "sad"
surprised  = "happy"
unknown    = "neutral"

# OmniVoice `guidance_scale` per emotion bin. Higher = more conditioning =
# more of the ref clip's prosody bleeds into the synthesized line. OmniVoice's
# constructor default is 2.0, so the per-emotion overrides anchor there and
# push *up* for intense emotions to amplify ref-driven expression. The
# previous range (0.6-0.9) was below the default and actually weakened the
# emotion transfer it was supposed to enable; first ear-test on the masha
# clip surfaced this.
[emotion_guidance]
# Lowered + flattened on 2026-06-19 (was 1.8/2.0/2.8/3.0/2.6) — high happy/angry
# made OmniVoice over-emote (exaggerated, cartoonish). Gentler profile; emotion
# still varies slightly but the voice stays composed. Tune by ear.
neutral = 1.3
sad     = 1.4
happy   = 1.6
angry   = 1.7
fearful = 1.5

# ─── Ingest ───────────────────────────────────────────────────────────────────
[[stages.ingest.candidates]]
id     = "ffmpeg"
module = "patmir.pipeline.stages.ingest.ffmpeg"

# ─── Separate (vocals vs music + sfx) ─────────────────────────────────────────
# Demucs on MLX (demucs-mlx) — Apple-Silicon-native separation (2026-06-15).
# Same htdemucs_ft model + output contract as the PyTorch candidate, runs on the
# Mac GPU via MLX. ACTIVE batch separator. The PyTorch `htdemucs` candidate below
# stays registered as a fallback — flip [pipeline].separate to revert.
[[stages.separate.candidates]]
id      = "htdemucs_mlx"
module  = "patmir.pipeline.stages.separate.htdemucs_mlx"
model   = "htdemucs_ft"   # bagged ensemble, state-of-art; ~300 MB weights
shifts  = 1
overlap = 0.25

# Vocals-specialist single model from the htdemucs_ft bag (sig 04573f0d). The ft
# bag takes its vocals stem 100% from this sub-model, so vocals are identical to
# the full bag (~0.998 corr ear-confirmed) while skipping the drums/bass/other
# models → ~7× faster. accompaniment = mix - vocals. Highest-leverage speedup:
# separate ~39s/60s → ~8s/60s. ADR 2026-06-19-vocals-only-separation.
[[stages.separate.candidates]]
id          = "htdemucs_mlx_vocals"
module      = "patmir.pipeline.stages.separate.htdemucs_mlx"
model       = "04573f0d"
vocals_only = true
shifts      = 1
overlap     = 0.25

# Base single-model Demucs on MLX — ~4× faster than the _ft 4-model bag.
# Watch-along's streaming config overrides separate → this.
[[stages.separate.candidates]]
id      = "htdemucs_mlx_fast"
module  = "patmir.pipeline.stages.separate.htdemucs_mlx"
model   = "htdemucs"
shifts  = 1
overlap = 0.25

# PyTorch Demucs (MPS) — fallback for both variants. ~4× faster base model is
# `htdemucs_fast`. Flip [pipeline].separate / the streaming override to use.
[[stages.separate.candidates]]
id     = "htdemucs"
module = "patmir.pipeline.stages.separate.htdemucs"
model  = "htdemucs_ft"   # bagged ensemble, state-of-art; ~300 MB weights
device = "auto"          # auto → mps on Apple Silicon

[[stages.separate.candidates]]
id     = "htdemucs_fast"
module = "patmir.pipeline.stages.separate.htdemucs"
model  = "htdemucs"
device = "auto"

# ─── Diarize (who-spoke-when) ─────────────────────────────────────────────────
# Runs on the Demucs vocal stem; pyannote 3.1 is SOTA on DIHARD/AMI and has
# native overlap detection that the speaker_tag pass uses to split sentences
# that cross a speaker boundary. Token is read from `HF_TOKEN` env var, or
# falls back to the `hf auth login` cached token. One-time license acceptance
# required on all three gated repos pyannote 3.1 pulls in:
#   - https://huggingface.co/pyannote/segmentation-3.0
#   - https://huggingface.co/pyannote/speaker-diarization-3.1
#   - https://huggingface.co/pyannote/speaker-diarization-community-1
# NVIDIA Sortformer 4-speaker streaming diarization on MLX via mlx-audio.
# ACTIVE local diarizer (2026-06-15) — replaced cloud Scribe v2 after ElevenLabs
# credits were exhausted. End-to-end neural diarization (no clustering knobs);
# resolves short cartoon turns far better than pyannote (the failure that drove
# the Scribe swap). Emits concurrent speakers, so we re-derive overlap intervals
# (restores the overlap output Scribe dropped — quality issue #5). Capped at 4
# speakers (model architecture). pyannote_3_1 below stays the fallback — flip
# [pipeline].diarize to revert. ADR: 2026-06-15-local-asr-diarize-via-mlx-audio.
[[stages.diarize.candidates]]
id                = "sortformer_mlx"
module            = "patmir.pipeline.stages.diarize.sortformer_mlx"
repo_id           = "mlx-community/diar_streaming_sortformer_4spk-v2.1-fp32"
chunk_duration    = 5.0
merge_gap_seconds = 0.5    # merge adjacent same-speaker segments separated by ≤ this gap into one turn

[[stages.diarize.candidates]]
id              = "pyannote_3_1"
module          = "patmir.pipeline.stages.diarize.pyannote"
model_id        = "pyannote/speaker-diarization-community-1"   # 2026-05-27 swap from 3.1 → community-1 (newer embeddings; better short-turn resolution for cartoon dialogue)
device          = "auto"   # auto → cuda > mps > cpu; pyannote MPS coverage is partial, set "cpu" if it crashes
min_speakers    = 0        # 0 = let pyannote estimate; ignored when num_speakers > 0
max_speakers    = 8        # ignored when num_speakers > 0
num_speakers    = 4        # exact speaker count for masha-2-5min (4 distinct characters). Set to 0 to let pyannote infer.
hf_token_env    = "HF_TOKEN"
# Note: ref-clip slicing is no longer done in this stage — it runs in the
# runner after the `emotion` stage, so per-(speaker, emotion) ref clips
# can be picked. `min_ref_seconds` lives under `[pipeline.options]` now.

# Scribe v2 — cloud-side diarizer (and the ASR for the same job; see
# `[[stages.asr.candidates]]` below). One HTTPS call returns words + per-word
# `speaker_id`; we collapse same-speaker runs into turns. Picked 2026-05-27
# after pyannote community-1 still merged a short (~1 s) female line into the
# surrounding male's bucket on masha-2-5min. Scribe v2 advertises 98%
# speaker-label accuracy; better on cartoon-pace short turns.
# Result is cached at `<job>/scribe/result.json` so the asr candidate
# (matching id) doesn't repeat the upload.
[[stages.diarize.candidates]]
id                     = "elevenlabs_scribe_v2"
module                 = "patmir.pipeline.stages.diarize.elevenlabs_scribe"
api_key_env            = "ELEVENLABS_API_KEY"
model_id               = "scribe_v2"
num_speakers           = 4         # exact speaker count for masha-2-5min. Set to 0 to let Scribe infer.
# diarization_threshold = 0.22     # default; lower → more clusters / looser merges
timeout_seconds        = 600.0

# ─── Emotion (speech emotion recognition; Phase 2.x) ──────────────────────────
# Runs on the Demucs vocal stem per diarization turn. Outputs feed two
# downstream consumers: ref_picker (chooses per-(speaker, emotion) clips)
# and apply_emotion_tags (tags each ASR sentence with its dominant emotion).
[[stages.emotion.candidates]]
id             = "emotion2vec_plus_base"
module         = "patmir.pipeline.stages.emotion.emotion2vec"
model_id       = "iic/emotion2vec_plus_base"
device         = "auto"
min_confidence = 0.5   # below this, the prediction is reassigned to "neutral"
hub            = "hf"  # ModelScope (default) is China-hosted + slow from US; HF mirror is Cloudflare-fronted

# ─── ASR ──────────────────────────────────────────────────────────────────────
#
# Cloud route: OpenRouter chat-completions multimodal audio. OpenRouter does
# NOT expose a dedicated /v1/audio/transcriptions endpoint (verified 2026-05-26;
# returns HTTP 500 for transcribe-SKU model ids). Audio-in is via
# /v1/chat/completions with input_audio content blocks. Word-level timestamps
# are recovered by the local MMS-FA forced aligner inside the candidate.
#
# Active default: `openai/gpt-audio` — clean Russian transcription on Masha
# clips; same model family as the (no-longer-exposed) gpt-4o-transcribe.
# Cost ~$1.20/hour of audio at posted rates.
#
# See ADR 2026-05-26-cloud-asr-via-openrouter.md.

[[stages.asr.candidates]]
id              = "openrouter_gpt_audio"
module          = "patmir.pipeline.stages.asr.openrouter_stt"
model           = "openai/gpt-audio"
api_key_env     = "OPENROUTER_API_KEY"
chunk_seconds   = 240.0
timeout_seconds = 240.0
max_tokens      = 4096
temperature     = 0.0
language        = "ru"   # ctx.source_lang overrides this when set upstream

# Voxtral Small 24B — cheaper alternate (~$0.36/hr). Russian transcription
# usable but slightly weaker than gpt-audio (minor word swaps observed).
[[stages.asr.candidates]]
enabled         = false
id              = "openrouter_voxtral_small_24b"
module          = "patmir.pipeline.stages.asr.openrouter_stt"
model           = "mistralai/voxtral-small-24b-2507"
api_key_env     = "OPENROUTER_API_KEY"
chunk_seconds   = 240.0
timeout_seconds = 240.0
max_tokens      = 4096
temperature     = 0.0

# GPT Audio Mini — cheapest GPT-Audio SKU but tends to safety-refuse short
# cartoon dialogue ("Извините, я не могу помочь с этим"). Shipped disabled.
[[stages.asr.candidates]]
enabled         = false
id              = "openrouter_gpt_audio_mini"
module          = "patmir.pipeline.stages.asr.openrouter_stt"
model           = "openai/gpt-audio-mini"
api_key_env     = "OPENROUTER_API_KEY"
chunk_seconds   = 240.0
timeout_seconds = 240.0
max_tokens      = 4096
temperature     = 0.0

# GPT-4o Audio Preview — listed in OpenRouter's catalog but our key returns
# 404 (model_not_found from upstream OpenAI). Kept disabled as a tripwire if
# OpenAI re-enables access broadly.
[[stages.asr.candidates]]
enabled         = false
id              = "openrouter_gpt4o_audio_preview"
module          = "patmir.pipeline.stages.asr.openrouter_stt"
model           = "openai/gpt-4o-audio-preview"
api_key_env     = "OPENROUTER_API_KEY"
chunk_seconds   = 240.0
timeout_seconds = 240.0
max_tokens      = 4096
temperature     = 0.0

# ElevenLabs Scribe v2 — native word timestamps + diarization (up to 32
# speakers) in one HTTPS call. Used 2026-05-27 onward as both the asr and
# diarize candidate; result is cached at `<job>/scribe/result.json` so the
# two stages share a single upload. See the matching diarize candidate
# above and ADR `2026-05-27-scribe-v2-for-asr-and-diarize.md`.
[[stages.asr.candidates]]
id                     = "elevenlabs_scribe_v2"
module                 = "patmir.pipeline.stages.asr.elevenlabs_scribe"
api_key_env            = "ELEVENLABS_API_KEY"
model_id               = "scribe_v2"
num_speakers           = 4         # match the diarize candidate's value
timeout_seconds        = 600.0

[[stages.asr.candidates]]
id            = "faster_whisper_large_v3_turbo"
module        = "patmir.pipeline.stages.asr.faster_whisper"
model_id      = "large-v3-turbo"
device        = "auto"       # auto → cpu on Mac (CT2 has no MPS); cuda on GPU box
compute_type  = "int8"
# ASR runs on the isolated vocals from the `separate` stage — mostly real
# silence with occasional speech — so Silero VAD is reliable here and prevents
# Whisper from hallucinating phrases like "Thank you." on silent stretches.
vad_filter    = true

# Quality-leaning fallback. Same module; bigger Whisper checkpoint.
[[stages.asr.candidates]]
id            = "faster_whisper_large_v3"
module        = "patmir.pipeline.stages.asr.faster_whisper"
model_id      = "large-v3"
device        = "auto"
compute_type  = "int8"
vad_filter    = true

# Qwen3-ASR (Apache-2.0, Jan 2026). 52 languages incl. EN + RU. Beats
# Whisper-large-v3 on multilingual avg (CommonVoice 9.18 vs 10.77) and on
# noisy English (LibriSpeech other 3.38 vs 3.97).
#
# Two backends — pick by platform:
#   - On Apple Silicon: use `qwen3_asr_*_mlx` (runs on the Mac GPU + unified
#     memory via `mlx-qwen3-asr`, includes a working MLX ForcedAligner).
#   - On NVIDIA GPU box: use `qwen3_asr_*` below (official `qwen-asr`).
#
# The official PyTorch `qwen-asr` package pins `transformers<5` which conflicts
# with omnivoice (needs transformers>=5). The MLX path has no such conflict.
#
# Install before enabling:
#   Mac:  `uv pip install mlx-qwen3-asr`
#   CUDA: `uv pip install qwen-asr`
[[stages.asr.candidates]]
id              = "qwen3_asr_1_7b"
module          = "patmir.pipeline.stages.asr.qwen3_asr"
model_id        = "Qwen/Qwen3-ASR-1.7B"
device          = "auto"
dtype           = "bfloat16"
forced_aligner  = "Qwen/Qwen3-ForcedAligner-0.6B"
aligner_dtype   = "bfloat16"
max_new_tokens  = 256

[[stages.asr.candidates]]
id              = "qwen3_asr_0_6b"
module          = "patmir.pipeline.stages.asr.qwen3_asr"
model_id        = "Qwen/Qwen3-ASR-0.6B"
device          = "auto"
dtype           = "bfloat16"
forced_aligner  = "Qwen/Qwen3-ForcedAligner-0.6B"
aligner_dtype   = "bfloat16"
max_new_tokens  = 256

# Qwen3-ASR via MLX — native Apple Silicon GPU, working forced aligner.
# Use these on Mac instead of the CUDA-targeted entries above. Loads weights
# directly from mlx-community/ (already MLX-formatted).
#
# 8bit is the default — best quality/disk tradeoff for a 1.7B ASR model on
# Apple Silicon. Pure 4bit can cause text-quality regressions on low-resource
# languages; bf16 is overkill for a 1.7B model (and 2x the disk).
[[stages.asr.candidates]]
id              = "qwen3_asr_1_7b_mlx_8bit"
module          = "patmir.pipeline.stages.asr.qwen3_asr_mlx"
model_id        = "mlx-community/Qwen3-ASR-1.7B-8bit"
dtype           = "bfloat16"
forced_aligner  = "Qwen/Qwen3-ForcedAligner-0.6B"
aligner_dtype   = "bfloat16"

# Higher-precision bf16 variant of Qwen3-ASR-1.7B. ~3.4 GB resident (vs
# 2.3 GB at 8-bit). Reduces CJK hallucinations on cartoon sound effects
# at the cost of more memory.
[[stages.asr.candidates]]
id              = "qwen3_asr_1_7b_mlx_bf16"
module          = "patmir.pipeline.stages.asr.qwen3_asr_mlx"
model_id        = "mlx-community/Qwen3-ASR-1.7B-bf16"
dtype           = "bfloat16"
forced_aligner  = "Qwen/Qwen3-ForcedAligner-0.6B"
aligner_dtype   = "bfloat16"

[[stages.asr.candidates]]
id              = "qwen3_asr_1_7b_mlx_4bit"
module          = "patmir.pipeline.stages.asr.qwen3_asr_mlx"
model_id        = "mlx-community/Qwen3-ASR-1.7B-4bit"
dtype           = "bfloat16"
forced_aligner  = "Qwen/Qwen3-ForcedAligner-0.6B"
aligner_dtype   = "bfloat16"

[[stages.asr.candidates]]
id              = "qwen3_asr_0_6b_mlx_bf16"
module          = "patmir.pipeline.stages.asr.qwen3_asr_mlx"
model_id        = "mlx-community/Qwen3-ASR-0.6B-bf16"
dtype           = "bfloat16"
forced_aligner  = "Qwen/Qwen3-ForcedAligner-0.6B"
aligner_dtype   = "bfloat16"

# Whisper-large-v3 via mlx-whisper (Apple Metal native). 99 languages
# including English + Russian. Native word timestamps — no separate
# forced-aligner needed. ~3 GB resident at fp16.
# Install once: `uv pip install mlx-whisper`.
# Note: this repo uses the older `weights.npz` filename that mlx-whisper
