module        = "patmir.pipeline.stages.asr.faster_whisper"
model_id      = "large-v3-turbo"
device        = "auto"       # auto → cpu on Mac (CT2 has no MPS); cuda on GPU box
compute_type  = "int8"
# ASR runs on the isolated vocals from the `separate` stage — mostly real
# silence with occasional speech — so Silero VAD is reliable here and prevents
