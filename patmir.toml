# Patmir configuration.
#
# Per the tech-stack: "per-stage config loaded from a single patmir.toml so
# model swaps are config changes, not code changes."
#
# Phase 0 only uses [eval.*] sections. Pipeline stages will come later.
#
# ──────────────────────────────────────────────────────────────────────────────
# LOCAL-FIRST POLICY
# ──────────────────────────────────────────────────────────────────────────────
# Patmir is strictly local-first. Cloud candidates are declared here for
# documentation and so they can be turned on per-stage *if and only if* the
# local options for that stage have been tried and found inadequate. They are
# never enabled by default. See `agent-os/product/mission.md` and Phase 0
# shape notes.

# ──────────────────────────────────────────────────────────────────────────────
# Translation candidates (eval).
# ──────────────────────────────────────────────────────────────────────────────

[[eval.translation.candidates]]
id        = "nllb_200_distilled_600m"
enabled   = true
module    = "patmir.eval.candidates.translation.nllb_200_distilled_600m"
model_id  = "facebook/nllb-200-distilled-600M"
device    = "mps"           # "cpu" | "mps" | "cuda" — default to Apple Metal on M-series Macs

# NLLB-200-3.3B via Transformers on MPS at fp16. ~6.6 GB resident.
# Same loader as the 600M distilled candidate; the only difference is
# model size + dtype. fp16 keeps the model within the 32 GB Mac budget.
[[eval.translation.candidates]]
id        = "nllb_200_3.3b"
enabled   = true
module    = "patmir.eval.candidates.translation.nllb_200_distilled_600m"  # same loader
model_id  = "facebook/nllb-200-3.3B"
device    = "mps"
dtype     = "float32"
max_new_tokens = 512
num_beams = 4
no_repeat_ngram_size = 3

# DEAD END — acceldium/nllb-200-3.3B-GGUF requires a fork of llama.cpp that
# implements the `nllb` architecture; upstream llama.cpp does not, and
# llama-cpp-python builds against upstream. Kept here as a documented
# non-viable path so future scans don't re-explore it.
[[eval.translation.candidates]]
id          = "nllb_200_3_3b_gguf"
enabled     = false
module      = "patmir.eval.candidates.translation.nllb_gguf"
repo_id     = "acceldium/nllb-200-3.3B-GGUF"
filename    = "nllb-3.3B.gguf"
max_tokens  = 512
temperature = 0.0
top_p       = 1.0
n_ctx       = 1024
n_gpu_layers = -1

[[eval.translation.candidates]]
id        = "madlad_400"
enabled   = false
module    = "patmir.eval.candidates.translation.madlad_400"
model_id  = "google/madlad400-3b-mt"
device    = "cuda"

# Cloud fallbacks — only enable if the entire local set above has been
# evaluated and judged inadequate for Armenian translation. Each enables
# a separate per-stage cloud opt-in.
[[eval.translation.candidates]]
id        = "gpt_cloud"
enabled   = false
module    = "patmir.eval.candidates.translation.gpt_cloud"
model     = "gpt-4o"
# OPENAI_API_KEY is read from the environment.

[[eval.translation.candidates]]
id        = "claude_cloud"
enabled   = false
module    = "patmir.eval.candidates.translation.claude_cloud"
model     = "claude-opus-4-7"
# ANTHROPIC_API_KEY is read from the environment.

# ──────────────────────────────────────────────────────────────────────────────
# Translation candidates added post-Phase-0 — registered, not yet enabled.
# Picked up by the GPU re-eval pass. See Phase 1 spec for details.
# ──────────────────────────────────────────────────────────────────────────────

# Gen2B/HyGPT-10b-it — Eastern-Armenian-centric LLM (Gemma-2-9b base, 10B AR
# tokens, July 2025). Supports EN/RU/hy translation via prompting.
# ~20 GB VRAM at fp16; GPU workstation required.
[[eval.translation.candidates]]
id        = "hygpt_10b_it"
enabled   = false
module    = "patmir.eval.candidates.translation.hygpt"
model_id  = "Gen2B/HyGPT-10b-it"
device    = "cuda"

# Helsinki-NLP OPUS-MT — explicit Eastern Armenian, ~80 MB each, MPS-friendly.
# Modest quality (BLEU 16.6 on en→hy Tatoeba). Fast-path A/B candidates.
[[eval.translation.candidates]]
id        = "opus_mt_en_hy"
enabled   = false
module    = "patmir.eval.candidates.translation.opus_mt"
model_id  = "Helsinki-NLP/opus-mt-en-hy"
source_lang = "en"
device    = "mps"

[[eval.translation.candidates]]
id        = "opus_mt_ru_hy"
enabled   = false
module    = "patmir.eval.candidates.translation.opus_mt"
model_id  = "Helsinki-NLP/opus-mt-ru-hy"
source_lang = "ru"
device    = "mps"

# Qwen3 instruction-tuned LLM via mlx-lm — runs on Apple Silicon GPU + unified
# memory. Used as a prompted translator; far stronger on idioms / register /
# narration than NLLB-600M. Qwen3 has no 7B variant in its lineup (4B → 8B
# → 14B), so the closest analog to "Qwen3-7B-Instruct" is Qwen3-8B at 4-bit.
# Install once: `uv pip install mlx-lm`
[[eval.translation.candidates]]
id          = "qwen3_8b_mlx"
enabled     = true
module      = "patmir.eval.candidates.translation.qwen3_instruct_mlx"
model_id    = "mlx-community/Qwen3-8B-4bit"
max_tokens  = 256
temperature = 0.0
no_think    = true

[[eval.translation.candidates]]
id          = "qwen3_4b_instruct_mlx"
enabled     = false
module      = "patmir.eval.candidates.translation.qwen3_instruct_mlx"
model_id    = "mlx-community/Qwen3-4B-Instruct-2507-4bit"
max_tokens  = 256
temperature = 0.0
no_think    = true

[[eval.translation.candidates]]
id          = "qwen3_14b_mlx"
enabled     = false
module      = "patmir.eval.candidates.translation.qwen3_instruct_mlx"
model_id    = "mlx-community/Qwen3-14B-4bit"
max_tokens  = 256
temperature = 0.0
no_think    = true

# Qwen3.6-27B — Apr 2026 release. ~3.4x the parameters of Qwen3-8B, meaningfully
# better on low-resource languages like Armenian. 4bit is 15 GB on disk;
# 5bit is 18 GB. Both fit comfortably alongside the other pipeline stages on
# 32 GB shared memory given the lazy-load runner only holds one stage at a time.
# No "Instruct" suffix — Qwen3.6 uses the hybrid thinking model with chat templates
# (same pattern as Qwen3-8B).
[[eval.translation.candidates]]
id          = "qwen3_6_27b_mlx_4bit"
enabled     = false
module      = "patmir.eval.candidates.translation.qwen3_instruct_mlx"
model_id    = "mlx-community/Qwen3.6-27B-4bit"
max_tokens  = 256
temperature = 0.1
top_p       = 0.9
repetition_penalty = 1.15
no_think    = true

[[eval.translation.candidates]]
id          = "qwen3_6_27b_mlx_5bit"
enabled     = false
module      = "patmir.eval.candidates.translation.qwen3_instruct_mlx"
model_id    = "mlx-community/Qwen3.6-27B-5bit"
max_tokens  = 256
temperature = 0.1
top_p       = 0.9
repetition_penalty = 1.15
no_think    = true

# Unsloth Dynamic v2.0 4-bit variant of Qwen3.6-27B — selective high-precision
# quantization keeps more bits in sensitive layers (where low-resource language
# knowledge lives), at the cost of larger weights (~26 GB vs 15 GB for plain
# 4-bit). Best 4-bit-class quality available for Armenian on a 32 GB Mac.
[[eval.translation.candidates]]
id          = "qwen3_6_27b_unsloth_ud_mlx_4bit"
enabled     = false
module      = "patmir.eval.candidates.translation.qwen3_instruct_mlx"
model_id    = "unsloth/Qwen3.6-27B-UD-MLX-4bit"
max_tokens  = 256
temperature = 0.1
top_p       = 0.9
repetition_penalty = 1.15
no_think    = true

# Qwen3-14B Q4_K_M via llama.cpp Metal backend. ~9 GB on disk; fits the
# 32 GB Mac with headroom for ASR + TTS without thrashing. K-quants
# preserve more precision in attention layers than plain Q4.
# Install once: `CMAKE_ARGS="-DGGML_METAL=on" uv pip install llama-cpp-python`.
# Quality on Armenian was visibly weaker than the 27B and 30B-A3B options;
# kept here as a small-memory fallback.
[[eval.translation.candidates]]
id          = "qwen3_14b_gguf_q4km"
enabled     = false
module      = "patmir.eval.candidates.translation.qwen3_gguf"
repo_id     = "unsloth/Qwen3-14B-GGUF"
filename    = "Qwen3-14B-Q4_K_M.gguf"
max_tokens  = 256
temperature = 0.1
top_p       = 0.9
repetition_penalty = 1.15
n_ctx       = 4096
n_gpu_layers = -1
no_think    = true

# Qwen3-30B-A3B (MoE) Q4_K_M via llama.cpp Metal. ~17 GB on disk; activates
# only ~3B parameters per token thanks to MoE sparsity, so it stays fast on
# Apple Silicon while having the lexical breadth of a 30B model — important
# for low-resource Armenian.
[[eval.translation.candidates]]
id          = "qwen3_30b_a3b_gguf_q4km"
enabled     = true
module      = "patmir.eval.candidates.translation.qwen3_gguf"
repo_id     = "unsloth/Qwen3-30B-A3B-GGUF"
filename    = "Qwen3-30B-A3B-Q4_K_M.gguf"
max_tokens  = 256
temperature = 0.1
top_p       = 0.9
repetition_penalty = 1.15
n_ctx       = 4096
n_gpu_layers = -1
no_think    = true

# ──────────────────────────────────────────────────────────────────────────────
# TTS candidates (eval).
# ──────────────────────────────────────────────────────────────────────────────

# NOTE: `facebook/mms-tts-hye` does not exist on HuggingFace — Meta only
# ships Western Armenian (`hyw`), which is the wrong dialect for this project.
# See `agent-os/product/tech-stack.md` Stage 4 and `mission.md`.
# The actual local Eastern-Armenian TTS is the community Piper voice below.

[[eval.tts.candidates]]
id          = "piper_hye"
enabled     = true
module      = "patmir.eval.candidates.tts.piper_hye"
repo_id     = "davit312/piper-TTS-Armenian"
onnx_file   = "v3/hy_AM-gor-medium.onnx"
config_file = "v3/hy_AM-gor-medium.onnx.json"

# OmniVoice — zero-shot multilingual TTS (k2-fsa/OmniVoice, Apache-2.0, ~0.6B
# params). Lists 646 languages, Armenian among them (`hy`/`hye`, ~42 h of
# training data). Dialect is the macrolanguage code so Eastern vs Western
# has to be ear-judged. Voice-clone-only — needs a reference audio + its
# transcription. Default reference is one of the Phase 0 Piper outputs
# (known Eastern-Armenian dialect); swap for your own native voice memo
# later.
[[eval.tts.candidates]]
id          = "omnivoice"
enabled     = false
module      = "patmir.eval.candidates.tts.omnivoice"
model_id    = "k2-fsa/OmniVoice"
device      = "auto"     # auto → mps on Apple Silicon
dtype       = "float16"  # halved-weight footprint to fit MPS on 32 GB Mac
ref_audio   = "eval_runs/20260524-160019/tts/piper_hye/hy-cartoon-01.wav"
ref_text    = "Արկածի գնանք։"
num_step    = 32
speed       = 1.0

# MLX-native OmniVoice with int8 group-size-64 affine quantization
# (Apache-2.0). ~1 GB total resident (vs 3 GB for the PyTorch fp16 above),
# ~25% faster RTF on Apple Silicon. Same voice-clone interface.
# Install once: `uv pip install mlx-audio`.
[[eval.tts.candidates]]
id            = "omnivoice_mlx_q8"
enabled       = true
module        = "patmir.eval.candidates.tts.omnivoice_mlx"
repo_id       = "lightsofapollo/omnivoice-mlx-q8-g64"
ref_audio     = "eval_runs/20260524-160019/tts/piper_hye/hy-cartoon-01.wav"
ref_text      = "Արկածի գնանք։"
num_steps     = 32
guidance_scale = 2.0
language      = "None"
lang_code     = "None"

# Western-Armenian MMS-TTS — kept here disabled so the author can opt in to
# hear how a wrong-dialect baseline sounds for comparison. NOT a valid Phase 0
# candidate on its own; see mission.md.
[[eval.tts.candidates]]
id        = "mms_tts_hyw_western_only"
enabled   = false
module    = "patmir.eval.candidates.tts.mms_tts_hye"   # same loader, different model
model_id  = "facebook/mms-tts-hyw"
device    = "mps"

# Deferred to the GPU pass.
#
# CORRECTION (Phase 1 shaping): XTTS-v2's current model card lists 17 languages
# (en, es, fr, de, it, pt, pl, tr, ru, nl, cs, ar, zh-cn, ja, hu, ko, hi).
# Armenian is NOT among them. XTTS-v2 cannot produce Armenian without a full
# language fine-tune, which is out of Phase 1/2 scope. Entry kept here as a
# documented dead end so future scans don't re-add it. See tech-stack.md
# Stage 4 for the matching correction.
[[eval.tts.candidates]]
id        = "xtts_v2"
enabled   = false
module    = "patmir.eval.candidates.tts.xtts_v2"
device    = "cuda"

[[eval.tts.candidates]]
id        = "bark"
enabled   = false
module    = "patmir.eval.candidates.tts.bark"
device    = "cuda"

# Cloud fallback — only enable if the entire local TTS set above has been
# evaluated and judged inadequate.
[[eval.tts.candidates]]
id        = "google_tts_cloud"
enabled   = false
module    = "patmir.eval.candidates.tts.google_tts_cloud"
voice     = "hy-AM-Standard-A"
# GOOGLE_APPLICATION_CREDENTIALS env var must point at a service-account JSON.


# ──────────────────────────────────────────────────────────────────────────────
# Phase 1 pipeline.
# ──────────────────────────────────────────────────────────────────────────────
# `[pipeline]` is the single source of truth for which candidate runs each
# stage. Each value is a candidate `id`; translation/tts ids resolve against
# `[[eval.<stage>.candidates]]`, the four new stages against
# `[[stages.<stage>.candidates]]` below.

[pipeline]
ingest    = "ffmpeg"
separate  = "htdemucs"
asr       = "whisper_large_v3_mlx_fp16"
translate = "nllb_200_3.3b"
tts       = "omnivoice_mlx_q8"
mux       = "ffmpeg_pad_stretch"
output    = "mkv_default"

[pipeline.options]
stretch_cap       = 0.20    # max ±20% time-stretch ratio per sentence (preserves pitch)
asr_int8          = true
keep_intermediate = true
music_bed_gain    = 0.6     # accompaniment level under the AR voice (1.0 = unchanged)
voice_gain_db     = 0.0     # extra dB applied to the AR voice over its native level

# ─── Ingest ───────────────────────────────────────────────────────────────────
[[stages.ingest.candidates]]
id     = "ffmpeg"
module = "patmir.pipeline.stages.ingest.ffmpeg"

# ─── Separate (vocals vs music + sfx) ─────────────────────────────────────────
[[stages.separate.candidates]]
id     = "htdemucs"
module = "patmir.pipeline.stages.separate.htdemucs"
model  = "htdemucs_ft"   # bagged ensemble, state-of-art; ~300 MB weights
device = "auto"          # auto → mps on Apple Silicon

# ─── ASR ──────────────────────────────────────────────────────────────────────
[[stages.asr.candidates]]
id            = "faster_whisper_large_v3_turbo"
module        = "patmir.pipeline.stages.asr.faster_whisper"
model_id      = "large-v3-turbo"
device        = "auto"       # auto → cpu on Mac (CT2 has no MPS); cuda on GPU box
compute_type  = "int8"
# ASR runs on the isolated vocals from the `separate` stage — mostly real
# silence with occasional speech — so Silero VAD is reliable here and prevents
# Whisper from hallucinating phrases like "Thank you." on silent stretches.
vad_filter    = true

# Quality-leaning fallback. Same module; bigger Whisper checkpoint.
[[stages.asr.candidates]]
id            = "faster_whisper_large_v3"
module        = "patmir.pipeline.stages.asr.faster_whisper"
model_id      = "large-v3"
device        = "auto"
compute_type  = "int8"
vad_filter    = true

# Qwen3-ASR (Apache-2.0, Jan 2026). 52 languages incl. EN + RU. Beats
# Whisper-large-v3 on multilingual avg (CommonVoice 9.18 vs 10.77) and on
# noisy English (LibriSpeech other 3.38 vs 3.97).
#
# Two backends — pick by platform:
#   - On Apple Silicon: use `qwen3_asr_*_mlx` (runs on the Mac GPU + unified
#     memory via `mlx-qwen3-asr`, includes a working MLX ForcedAligner).
#   - On NVIDIA GPU box: use `qwen3_asr_*` below (official `qwen-asr`).
#
# The official PyTorch `qwen-asr` package pins `transformers<5` which conflicts
# with omnivoice (needs transformers>=5). The MLX path has no such conflict.
#
# Install before enabling:
#   Mac:  `uv pip install mlx-qwen3-asr`
#   CUDA: `uv pip install qwen-asr`
[[stages.asr.candidates]]
id              = "qwen3_asr_1_7b"
module          = "patmir.pipeline.stages.asr.qwen3_asr"
model_id        = "Qwen/Qwen3-ASR-1.7B"
device          = "auto"
dtype           = "bfloat16"
forced_aligner  = "Qwen/Qwen3-ForcedAligner-0.6B"
aligner_dtype   = "bfloat16"
max_new_tokens  = 256

[[stages.asr.candidates]]
id              = "qwen3_asr_0_6b"
module          = "patmir.pipeline.stages.asr.qwen3_asr"
model_id        = "Qwen/Qwen3-ASR-0.6B"
device          = "auto"
dtype           = "bfloat16"
forced_aligner  = "Qwen/Qwen3-ForcedAligner-0.6B"
aligner_dtype   = "bfloat16"
max_new_tokens  = 256

# Qwen3-ASR via MLX — native Apple Silicon GPU, working forced aligner.
# Use these on Mac instead of the CUDA-targeted entries above. Loads weights
# directly from mlx-community/ (already MLX-formatted).
#
# 8bit is the default — best quality/disk tradeoff for a 1.7B ASR model on
# Apple Silicon. Pure 4bit can cause text-quality regressions on low-resource
# languages; bf16 is overkill for a 1.7B model (and 2x the disk).
[[stages.asr.candidates]]
id              = "qwen3_asr_1_7b_mlx_8bit"
module          = "patmir.pipeline.stages.asr.qwen3_asr_mlx"
model_id        = "mlx-community/Qwen3-ASR-1.7B-8bit"
dtype           = "bfloat16"
forced_aligner  = "Qwen/Qwen3-ForcedAligner-0.6B"
aligner_dtype   = "bfloat16"

# Higher-precision bf16 variant of Qwen3-ASR-1.7B. ~3.4 GB resident (vs
# 2.3 GB at 8-bit). Reduces CJK hallucinations on cartoon sound effects
# at the cost of more memory.
[[stages.asr.candidates]]
id              = "qwen3_asr_1_7b_mlx_bf16"
module          = "patmir.pipeline.stages.asr.qwen3_asr_mlx"
model_id        = "mlx-community/Qwen3-ASR-1.7B-bf16"
dtype           = "bfloat16"
forced_aligner  = "Qwen/Qwen3-ForcedAligner-0.6B"
aligner_dtype   = "bfloat16"

[[stages.asr.candidates]]
id              = "qwen3_asr_1_7b_mlx_4bit"
module          = "patmir.pipeline.stages.asr.qwen3_asr_mlx"
model_id        = "mlx-community/Qwen3-ASR-1.7B-4bit"
dtype           = "bfloat16"
forced_aligner  = "Qwen/Qwen3-ForcedAligner-0.6B"
aligner_dtype   = "bfloat16"

[[stages.asr.candidates]]
id              = "qwen3_asr_0_6b_mlx_bf16"
module          = "patmir.pipeline.stages.asr.qwen3_asr_mlx"
model_id        = "mlx-community/Qwen3-ASR-0.6B-bf16"
dtype           = "bfloat16"
forced_aligner  = "Qwen/Qwen3-ForcedAligner-0.6B"
aligner_dtype   = "bfloat16"

# Whisper-large-v3 via mlx-whisper (Apple Metal native). 99 languages
# including English + Russian. Native word timestamps — no separate
# forced-aligner needed. ~3 GB resident at fp16.
# Install once: `uv pip install mlx-whisper`.
# Note: this repo uses the older `weights.npz` filename that mlx-whisper
# 0.4.3 expects natively. The newer `whisper-large-v3-fp16` repo (with
# `model.safetensors`) doesn't load through mlx-whisper without a rename.
[[stages.asr.candidates]]
id              = "whisper_large_v3_mlx_fp16"
module          = "patmir.pipeline.stages.asr.whisper_mlx"
repo_id         = "mlx-community/whisper-large-v3-mlx"
temperature     = 0.0
condition_on_previous_text = true
no_speech_threshold        = 0.6

# Whisper-large-v3-turbo (distilled, ~4× faster, ~same quality). Same loader.
[[stages.asr.candidates]]
id              = "whisper_large_v3_turbo_mlx"
module          = "patmir.pipeline.stages.asr.whisper_mlx"
repo_id         = "mlx-community/whisper-large-v3-turbo"
temperature     = 0.0
condition_on_previous_text = true
no_speech_threshold        = 0.6

# ─── Mux ──────────────────────────────────────────────────────────────────────
[[stages.mux.candidates]]
id     = "ffmpeg_pad_stretch"
module = "patmir.pipeline.stages.mux.ffmpeg_pad_stretch"

# ─── Output ───────────────────────────────────────────────────────────────────
[[stages.output.candidates]]
id     = "mkv_default"
module = "patmir.pipeline.stages.output.mkv"
