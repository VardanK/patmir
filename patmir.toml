# OmniVoice — zero-shot multilingual TTS (k2-fsa/OmniVoice, Apache-2.0, ~0.6B
# params). Lists 646 languages, Armenian among them (`hy`/`hye`, ~42 h of
# training data). Dialect is the macrolanguage code so Eastern vs Western
# has to be ear-judged. Voice-clone-only — needs a reference audio + its
# transcription. Default reference is one of the Phase 0 Piper outputs
# (known Eastern-Armenian dialect); swap for your own native voice memo
# later.
[[eval.tts.candidates]]
id          = "omnivoice"
enabled     = false
module      = "patmir.eval.candidates.tts.omnivoice"
model_id    = "k2-fsa/OmniVoice"
device      = "auto"     # auto → mps on Apple Silicon
dtype       = "float16"  # halved-weight footprint to fit MPS on 32 GB Mac
ref_audio   = "eval_runs/20260524-160019/tts/piper_hye/hy-cartoon-01.wav"
ref_text    = "Արկածի գնանք։"
num_step    = 32
speed       = 1.0

# MLX-native OmniVoice with int8 group-size-64 affine quantization
# (Apache-2.0). ~1 GB total resident (vs 3 GB for the PyTorch fp16 above),
# ~25% faster RTF on Apple Silicon. Same voice-clone interface.
# Install once: `uv pip install mlx-audio`.
# ACTIVE batch TTS — OmniVoice bf16 (mlx-community/OmniVoice-bfloat16), num_steps=32.
# Ear-test 2026-06-16 (hy line, same clean ref) ranked: bf16@32 EXCELLENT >
# q8@32 almost-excellent > bf16@16 good (slight nasal) > q8@16 good (some
# unintended inter-word pauses). bf16 also fastest in our pipeline at every step
# count (RTF 0.46@16 / 0.89@32 vs q8 0.67 / 1.20) and loads+clones via mlx-audio.
# Watch-along (D3) uses omnivoice_mlx_bf16_fast below.

# ACTIVE BATCH TTS (locked 2026-06-20). Higgs Audio v3 (4B) via a native MLX port
# of the Qwen3 AR backbone (q8) + PyTorch codec on MPS. Eastern-Armenian-capable,
# zero-shot cloning, and REAL emotion control via inline <|emotion:..|> tags
# (mapped from the pipeline's 5 bins in the candidate's EMOTION_TAGS). Head-to-head
# (same sentences+ref): agg RTF 1.10 vs OmniVoice-32's 1.69 — faster AND better.
# Non-termination guardrail: length-proportional max_new_tokens + reseed-on-overflow,
# temp 0.8 (lower temps caused MORE overflows, not fewer — measured). q4 rejected
# (collapses). Watch-along stays OmniVoice-16 (streaming/runner.py override).
# ADR: decisions/2026-06-20-higgs-v3-tts-mlx-q8.md
[[eval.tts.candidates]]
id            = "higgs_v3_mlx_q8"
enabled       = true
module        = "patmir.eval.candidates.tts.higgs_v3_mlx"
repo_id       = "multimodalart/higgs-audio-v3-tts-4b-transformers"
codec_id      = "bosonai/higgs-audio-v2-tokenizer"
quant         = "q8"
temperature   = 0.8
top_p         = 0.95
seed          = 0
max_retries   = 2
codec_device  = "mps"

# Watch-along (D3) Higgs — same q8 port, but max_retries=1 to bound worst-case
# per-section latency (a reseed-on-overflow is a full re-gen = a stream stall).
# Switched watch-along off omnivoice_mlx_bf16_fast 2026-06-20 (streaming/runner.py
# override) for engine consistency. NOTE: Higgs q8 agg RTF ~1.10 > OmniVoice-16's
# 0.91, so watch-along leans harder on the pre-buffer; per-speaker prefix-KV
# caching is the follow-up to bring it comfortably under realtime.
[[eval.tts.candidates]]
id            = "higgs_v3_mlx_q8_fast"
enabled       = true
module        = "patmir.eval.candidates.tts.higgs_v3_mlx"
repo_id       = "multimodalart/higgs-audio-v3-tts-4b-transformers"
codec_id      = "bosonai/higgs-audio-v2-tokenizer"
quant         = "q8"
temperature   = 0.8
top_p         = 0.95
seed          = 0
max_retries   = 1
codec_device  = "mps"

# Same Higgs Audio v3 model on PyTorch — the CUDA path. bf16 is the checkpoint's
# native dtype, so unlike the MLX path there is no quantization step and no
# q8-vs-bf16 quality question.
#
# `max_batch` is the headline knob: the AR decode is memory-bandwidth-bound on
# the 4B weights, so a step reads all of them to advance ONE sentence at batch 1.
# Batching amortizes that read, which is why TTS (~69% of batch wall) is the
# stage worth batching. 8 is chosen to be safely conservative on 24 GB rather
# than measured: weights are ~8 GB bf16 and the KV cache is cheap here because
# the model is GQA with 8 KV heads — 144 KiB/token, so B=8 over a 1500-token
# context is only ~1.7 GiB. Raise it after measuring; the ceiling is compute,
# not memory. Set to 1 to fall back to the adapter's per-sentence loop.
#
# `attn_implementation` stays "sdpa": the upstream port declares `_supports_sdpa`
# only, so flash_attention_2 is refused by transformers until upstream flags it.
#
# UNMEASURED on GPU as of 2026-08-23 — never run on the 3090. Batch-vs-single
# decode equivalence IS verified (bitwise, on a tiny CPU model — see
# test_higgs_torch_batch.py). Baseline to beat: MLX q8 on the M1 Pro, batch agg
# RTF 1.17 with TTS 244.4 s (69.4% of wall) on samples/Reacher-S02E01-5min.mkv.
[[eval.tts.candidates]]
id            = "higgs_v3_torch_bf16"
enabled       = true
module        = "patmir.eval.candidates.tts.higgs_v3_torch"
repo_id       = "multimodalart/higgs-audio-v3-tts-4b-transformers"
device        = "auto"        # auto -> cuda > mps > cpu
dtype         = "bfloat16"
attn_implementation = "sdpa"
temperature   = 0.8
top_p         = 0.95
seed          = 0
max_retries   = 2
max_batch     = 8

[[eval.tts.candidates]]
id            = "omnivoice_mlx_bf16"
enabled       = true
module        = "patmir.eval.candidates.tts.omnivoice_mlx"
repo_id       = "mlx-community/OmniVoice-bfloat16"
ref_audio     = "eval_runs/20260524-160019/tts/piper_hye/hy-cartoon-01.wav"
ref_text      = "Արկածի գնանք։"
num_steps     = 32
guidance_scale = 2.0
language      = "None"
lang_code     = "None"

