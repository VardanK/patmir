# Patmir configuration.
#
# Per the tech-stack: "per-stage config loaded from a single patmir.toml so
# model swaps are config changes, not code changes."
#
# Phase 0 only uses [eval.*] sections. Pipeline stages will come later.
#
# ──────────────────────────────────────────────────────────────────────────────
# LOCAL-FIRST POLICY
# ──────────────────────────────────────────────────────────────────────────────
# Patmir is strictly local-first. Cloud candidates are declared here for
# documentation and so they can be turned on per-stage *if and only if* the
# local options for that stage have been tried and found inadequate. They are
# never enabled by default. See `agent-os/product/mission.md` and Phase 0
# shape notes.

# ──────────────────────────────────────────────────────────────────────────────
# Translation candidates (eval).
# ──────────────────────────────────────────────────────────────────────────────

[[eval.translation.candidates]]
id        = "nllb_200_distilled_600m"
enabled   = true
module    = "patmir.eval.candidates.translation.nllb_200_distilled_600m"
model_id  = "facebook/nllb-200-distilled-600M"
device    = "mps"           # "cpu" | "mps" | "cuda" — default to Apple Metal on M-series Macs

# Deferred to the GPU pass — flip `enabled = true` once the workstation is ready.
[[eval.translation.candidates]]
id        = "nllb_200_3.3b"
enabled   = false
module    = "patmir.eval.candidates.translation.nllb_200_distilled_600m"  # same loader
model_id  = "facebook/nllb-200-3.3B"
device    = "cuda"

[[eval.translation.candidates]]
id        = "madlad_400"
enabled   = false
module    = "patmir.eval.candidates.translation.madlad_400"
model_id  = "google/madlad400-3b-mt"
device    = "cuda"

# Cloud fallbacks — only enable if the entire local set above has been
# evaluated and judged inadequate for Armenian translation. Each enables
# a separate per-stage cloud opt-in.
[[eval.translation.candidates]]
id        = "gpt_cloud"
enabled   = false
module    = "patmir.eval.candidates.translation.gpt_cloud"
model     = "gpt-4o"
# OPENAI_API_KEY is read from the environment.

[[eval.translation.candidates]]
id        = "claude_cloud"
enabled   = false
module    = "patmir.eval.candidates.translation.claude_cloud"
model     = "claude-opus-4-7"
# ANTHROPIC_API_KEY is read from the environment.

# ──────────────────────────────────────────────────────────────────────────────
# TTS candidates (eval).
# ──────────────────────────────────────────────────────────────────────────────

# NOTE: `facebook/mms-tts-hye` does not exist on HuggingFace — Meta only
# ships Western Armenian (`hyw`), which is the wrong dialect for this project.
# See `agent-os/product/tech-stack.md` Stage 4 and `mission.md`.
# The actual local Eastern-Armenian TTS is the community Piper voice below.

[[eval.tts.candidates]]
id          = "piper_hye"
enabled     = true
module      = "patmir.eval.candidates.tts.piper_hye"
repo_id     = "davit312/piper-TTS-Armenian"
onnx_file   = "v3/hy_AM-gor-medium.onnx"
config_file = "v3/hy_AM-gor-medium.onnx.json"

# Western-Armenian MMS-TTS — kept here disabled so the author can opt in to
# hear how a wrong-dialect baseline sounds for comparison. NOT a valid Phase 0
# candidate on its own; see mission.md.
[[eval.tts.candidates]]
id        = "mms_tts_hyw_western_only"
enabled   = false
module    = "patmir.eval.candidates.tts.mms_tts_hye"   # same loader, different model
model_id  = "facebook/mms-tts-hyw"
device    = "mps"

# Deferred to the GPU pass.
[[eval.tts.candidates]]
id        = "xtts_v2"
enabled   = false
module    = "patmir.eval.candidates.tts.xtts_v2"
device    = "cuda"

[[eval.tts.candidates]]
id        = "bark"
enabled   = false
module    = "patmir.eval.candidates.tts.bark"
device    = "cuda"

# Cloud fallback — only enable if the entire local TTS set above has been
# evaluated and judged inadequate.
[[eval.tts.candidates]]
id        = "google_tts_cloud"
enabled   = false
module    = "patmir.eval.candidates.tts.google_tts_cloud"
voice     = "hy-AM-Standard-A"
# GOOGLE_APPLICATION_CREDENTIALS env var must point at a service-account JSON.
