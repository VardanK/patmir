# Patmir configuration.
#
# Per the tech-stack: "per-stage config loaded from a single patmir.toml so
# model swaps are config changes, not code changes."
#
# Phase 0 only uses [eval.*] sections. Pipeline stages will come later.
#
# ──────────────────────────────────────────────────────────────────────────────
# LOCAL-FIRST POLICY
# ──────────────────────────────────────────────────────────────────────────────
# Patmir is strictly local-first. Cloud candidates are declared here for
# documentation and so they can be turned on per-stage *if and only if* the
# local options for that stage have been tried and found inadequate. They are
# never enabled by default. See `agent-os/product/mission.md` and Phase 0
# shape notes.

# ──────────────────────────────────────────────────────────────────────────────
# Translation candidates (eval).
# ──────────────────────────────────────────────────────────────────────────────

[[eval.translation.candidates]]
id        = "nllb_200_distilled_600m"
enabled   = true
module    = "patmir.eval.candidates.translation.nllb_200_distilled_600m"
model_id  = "facebook/nllb-200-distilled-600M"
device    = "mps"           # "cpu" | "mps" | "cuda" — default to Apple Metal on M-series Macs

# NLLB-200-3.3B via Transformers on MPS at fp16. ~6.6 GB resident.
# Same loader as the 600M distilled candidate; the only difference is
# model size + dtype. fp16 keeps the model within the 32 GB Mac budget.
[[eval.translation.candidates]]
id        = "nllb_200_3.3b"
enabled   = true
module    = "patmir.eval.candidates.translation.nllb_200_distilled_600m"  # same loader
model_id  = "facebook/nllb-200-3.3B"
device    = "mps"
dtype     = "float32"
max_new_tokens = 512
num_beams = 4
no_repeat_ngram_size = 3

# DEAD END — acceldium/nllb-200-3.3B-GGUF requires a fork of llama.cpp that
# implements the `nllb` architecture; upstream llama.cpp does not, and
# llama-cpp-python builds against upstream. Kept here as a documented
# non-viable path so future scans don't re-explore it.
[[eval.translation.candidates]]
id          = "nllb_200_3_3b_gguf"
enabled     = false
module      = "patmir.eval.candidates.translation.nllb_gguf"
repo_id     = "acceldium/nllb-200-3.3B-GGUF"
filename    = "nllb-3.3B.gguf"
max_tokens  = 512
temperature = 0.0
top_p       = 1.0
n_ctx       = 1024
n_gpu_layers = -1

[[eval.translation.candidates]]
id        = "madlad_400"
enabled   = false
module    = "patmir.eval.candidates.translation.madlad_400"
model_id  = "google/madlad400-3b-mt"
device    = "cuda"

# Cloud fallbacks — only enable if the entire local set above has been
# evaluated and judged inadequate for Armenian translation. Each enables
# a separate per-stage cloud opt-in.
[[eval.translation.candidates]]
id        = "gpt_cloud"
enabled   = false
module    = "patmir.eval.candidates.translation.gpt_cloud"
model     = "gpt-4o"
# OPENAI_API_KEY is read from the environment.

[[eval.translation.candidates]]
id        = "claude_cloud"
enabled   = false
module    = "patmir.eval.candidates.translation.claude_cloud"
model     = "claude-opus-4-7"
# ANTHROPIC_API_KEY is read from the environment.

# OpenRouter — unified gateway to frontier LLMs (GPT-5, Claude Opus 4.7,
# Gemini 2.5 Flash, etc.) behind one API key. The translate-side cloud
# escalation per local-first policy after local TTS + emotion routing
# failed the masha-clip ear-test on issue #3 (emotions not transferred).
# See `docs/architecture/decisions/2026-05-26-cloud-translate-via-openrouter.md`.
#
# Default model is the cheap, fast Gemini Flash for iteration; swap to
# `anthropic/claude-opus-4.7` or `openai/gpt-5` per the comparison runs.
[[eval.translation.candidates]]
id          = "openrouter_gemini_flash"
enabled     = true
module      = "patmir.eval.candidates.translation.openrouter"
# Gemini 3.5 Flash — superseded 2.5-flash 2026-05-26 after casual-register
# A/B (vs gemini-3.1-flash-lite). 3.5 produced more emotive/playful output
# (diminutives like `քչիկ`, exclamatory `Ի՜նչ թթու ա՜`) at the same speed.
model       = "google/gemini-3.5-flash"
api_key_env = "OPENROUTER_API_KEY"
max_tokens  = 512
temperature = 0.2
top_p       = 0.9
timeout_seconds = 60.0
# Gemini 3.5+ has mandatory reasoning (HTTP 400 if you try `enabled=false`).
# `effort=minimal` keeps reasoning_tokens at 0, halves latency (~2s vs ~4s
# per sentence), and drops per-call cost ~30×. Verified 2026-05-26.
reasoning   = { effort = "minimal" }

# Batched + structured-output variant of the same Gemini Flash backend.
# Translates N sentences per call (default 20) with a 2-sentence sliding
# overlap of already-translated context, and enforces a strict JSON-schema
# response (`{translations: [{idx, text}]}`). Speaker_id + emotion are
# injected as input metadata so the LLM keeps each character's vocabulary
# coherent across the chunk; the output schema only carries `idx + text`,
# so emotion/speaker/timing can never be lost — they're zipped back in by
# `idx` in the adapter from the source `Sentence`. Falls back to
# per-sentence translation for any chunk whose response fails validation
# (count mismatch, missing idx, empty text, transport error).
#
# Registered enabled=true but NOT the active default — flip
# `[pipeline].translate = "openrouter_gemini_flash_batch"` to A/B-test it
# against the per-sentence translator on the same source clip.
[[eval.translation.candidates]]
id              = "openrouter_gemini_flash_batch"
enabled         = true
module          = "patmir.eval.candidates.translation.openrouter_batch"
model           = "google/gemini-3.5-flash"
api_key_env     = "OPENROUTER_API_KEY"
max_tokens      = 4096        # batched output needs more headroom than 512
temperature     = 0.2
top_p           = 0.9
timeout_seconds = 120.0
chunk_size      = 20
overlap         = 2
reasoning       = { effort = "minimal" }

[[eval.translation.candidates]]
id          = "openrouter_claude_opus"
enabled     = false
module      = "patmir.eval.candidates.translation.openrouter"
model       = "anthropic/claude-opus-4.7"
api_key_env = "OPENROUTER_API_KEY"
max_tokens  = 512
temperature = 0.2

[[eval.translation.candidates]]
id          = "openrouter_gpt5"
enabled     = false
module      = "patmir.eval.candidates.translation.openrouter"
model       = "openai/gpt-5"
api_key_env = "OPENROUTER_API_KEY"
max_tokens  = 512
temperature = 0.2

# DeepSeek V4 Pro — REJECTED 2026-05-27 after benchmark on masha-2-5min.
# Even with `thinking={type: "disabled"}` (the DeepSeek-native passthrough,
# since OpenRouter's `reasoning.effort` is ignored by this model), 4/10
# sample sentences leaked chain-of-thought into the `content` field and
# avg latency was 10.9 s/sentence (~10× Gemini 3.5 Flash). Cheap on paper
# but production-unusable for the per-sentence translate loop. Entry left
# disabled so the verdict is discoverable; flip `enabled = true` and revisit
# only if DeepSeek ships a fix for the no-thinking-mode-content-leak bug.
[[eval.translation.candidates]]
id          = "openrouter_deepseek_v4_pro"
enabled     = false
module      = "patmir.eval.candidates.translation.openrouter"
model       = "deepseek/deepseek-v4-pro"
api_key_env = "OPENROUTER_API_KEY"
max_tokens  = 512
temperature = 0.2
top_p       = 0.9
timeout_seconds = 60.0
thinking    = { type = "disabled" }

