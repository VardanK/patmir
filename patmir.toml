# Google TranslateGemma — REJECTED 2026-05-27 for the cartoon-dub use case.
# Pure translation model (Gemma 3 base, structured chat template with
# `source_lang_code` / `target_lang_code` only, NO system-prompt surface,
# NO emotion or register control). 27B 4-bit MLX smoke-test on 10 masha
# sentences:
#   - Latency: ~37 s/sentence at max_tokens=256 on MPS (vs Gemini ~1 s).
#     Fixable via short max_tokens + stop-on-`(`, would land ~6 s/sentence.
#   - Quality: register is formal/literary (`Ցանկանո՞ւմ ես փորձել` vs
#     Gemini's `Ուզո՞ւմ ես փորձես`), and the model occasionally appends a
#     parenthesized transliteration (`Փխ, ինչ անհաճոյ։ (Phkh, inch a…)`)
#     which we can't suppress without the missing system-prompt surface.
# Net: doesn't match the casual-Yerevan dub register the project targets.
