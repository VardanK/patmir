compute_type  = "int8"
vad_filter    = true

# CUDA ASR FALLBACK (was briefly the active CUDA ASR, 2026-08-23 only). Same
# Whisper large-v3 via CTranslate2, but fp16 — int8 above exists because CT2 has
# no MPS backend and falls back to CPU on the Mac, where int8 is the only
# tolerable option. On a 3090 fp16 is both faster and closer to the reference
# checkpoint.
#
# This was selected for [pipeline.profiles.cuda] when the ONLY known way to run
# Qwen3-ASR on torch was the `qwen-asr` package, whose exact
# `transformers==4.57.6` pin is mutually exclusive with the Higgs TTS
# checkpoint's >=5.5. CTranslate2 has no transformers dependency at all, which
# made it the clean way out. Superseded the same day: transformers 5.13 carries
# native `qwen3_asr`, so `qwen3_asr_1_7b` reaches the same model with no package
# and no pin — and keeps the ASR stage identical in family across both machines.
# Flip [pipeline.profiles.cuda].asr back here if Qwen3-ASR misbehaves on CUDA.
#
# Whisper large-v3 is well characterized here: it was the Mac default until
# 2026-07-14 — clean on fast cartoon speech, prone to hallucinated repeats on
# singing/music windows.
[[stages.asr.candidates]]
id            = "faster_whisper_large_v3_fp16"
module        = "patmir.pipeline.stages.asr.faster_whisper"
model_id      = "large-v3"
device        = "auto"       # auto -> cuda on the GPU box
compute_type  = "float16"
vad_filter    = true

# Qwen3-ASR (Apache-2.0, Jan 2026). 52 languages incl. EN + RU. Beats
# Whisper-large-v3 on multilingual avg (CommonVoice 9.18 vs 10.77) and on
# noisy English (LibriSpeech other 3.38 vs 3.97).
#
# Two backends — pick by platform:
#   - On Apple Silicon: use `qwen3_asr_*_mlx` (runs on the Mac GPU + unified
#     memory via `mlx-qwen3-asr`, includes a working MLX ForcedAligner).
#   - On NVIDIA GPU box: use `qwen3_asr_*` below (transformers-native torch).
#
# DO NOT install the official `qwen-asr` package. It pins
# `transformers==4.57.6` EXACTLY, which is mutually exclusive with the Higgs
# TTS checkpoint's >=5.5 — installing it silently resolves transformers down
# and breaks the TTS stage. The torch entries below drive the same models
# through transformers' OWN `qwen3_asr` implementation (added in 5.13.0:
# Qwen3ASRForConditionalGeneration + Qwen3ASRForTokenClassification for the
# forced aligner), so there is no package and no pin to negotiate. The
# pyproject floor is `transformers>=5.13`, so a downgrade now fails at install
# time instead of at TTS build time.
#
# The torch entries take the `-hf` checkpoints (the transformers-native
# conversions). The unsuffixed repos are the layout `qwen-asr` reads and will
# NOT load through transformers.
#
# Long-form audio: the `qwen-asr` package segmented internally; the
# transformers API is single-shot, so the candidate chunks on the separate
# stage's Silero VAD intervals (capped at `chunk_seconds`) and runs the chunks
# batched (`batch_size`) through both the ASR and the aligner.
#
# Install before enabling:
#   Mac:  `uv pip install mlx-qwen3-asr`
#   CUDA: nothing — `transformers>=5.13` + torch already cover it
[[stages.asr.candidates]]
id              = "qwen3_asr_1_7b"
module          = "patmir.pipeline.stages.asr.qwen3_asr"
model_id        = "Qwen/Qwen3-ASR-1.7B-hf"
device          = "auto"       # auto -> cuda on the GPU box
dtype           = "bfloat16"
forced_aligner  = "Qwen/Qwen3-ForcedAligner-0.6B-hf"
aligner_dtype   = "bfloat16"
max_new_tokens  = 256
chunk_seconds   = 28.0         # cap per ASR window; cuts land in VAD silence
batch_size      = 8            # chunks decoded/aligned per batch

[[stages.asr.candidates]]
id              = "qwen3_asr_0_6b"
module          = "patmir.pipeline.stages.asr.qwen3_asr"
model_id        = "Qwen/Qwen3-ASR-0.6B-hf"
device          = "auto"
dtype           = "bfloat16"
forced_aligner  = "Qwen/Qwen3-ForcedAligner-0.6B-hf"
aligner_dtype   = "bfloat16"
max_new_tokens  = 256
chunk_seconds   = 28.0
batch_size      = 8

