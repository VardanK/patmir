model           = "openai/gpt-audio"
api_key_env     = "OPENROUTER_API_KEY"
chunk_seconds   = 240.0
timeout_seconds = 240.0
max_tokens      = 4096
temperature     = 0.0
language        = "ru"   # ctx.source_lang overrides this when set upstream

# Voxtral Small 24B — cheaper alternate (~$0.36/hr). Russian transcription
